<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> Demo District</title></title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #00f5ff, #8a2be2, #ff00cc);
      color: white;
      text-align: center;
    }

    header {
      padding: 40px 20px;
    }

    h1 {
      font-size: 3em;
      text-shadow: 0 0 15px rgba(255,255,255,0.8);
    }

    p {
      font-size: 1.2em;
      opacity: 0.9;
    }

    .divisions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 40px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      border-radius: 15px;
      padding: 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(255,255,255,0.5);
    }

    .card h2 {
      margin-bottom: 10px;
    }

    .join-btn {
      margin: 40px;
      padding: 15px 30px;
      font-size: 1.2em;
      border: none;
      border-radius: 30px;
      background: #ffffff;
      color: #8a2be2;
      cursor: pointer;
      transition: 0.3s;
    }

    .join-btn:hover {
      background: #ff00cc;
      color: white;
    }

    footer {
      padding: 20px;
      font-size: 0.9em;
      opacity: 0.7;
    }
  </style>
</head>

<body>

<header>
  <h1>Demo District</h1>
  <p>3v3 Na League.</p>
</header>

<section class="divisions">
  <div class="card">
    <h2>Nebula Division</h2>
    <p>Gold → Diamond</p>
  </div>

  <div class="card">
    <h2>Orbit Division</h2>
    <p>Champ → Champ</p>
  </div>

  <div class="card">
    <h2>Stellar Division</h2>
    <p>Grand Champ → Grand Champ</p>
  </div>

  <div class="card">
    <h2>Supernova Division</h2>
    <p>Grand Champ 3+</p>
  </div>
</section>

<button class="join-btn">https://discord.gg/JBUHq5gSzY</button>

<footer>
  <p>© 2026 Demo District</p>
</footer>

</body>
</html>
